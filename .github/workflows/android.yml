name: Build Forge Game Center Android
on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        working-directory: apps/android
        run: gradle assembleDebug
      - name: Prepare APK
        run: cp apps/android/app/build/outputs/apk/debug/app-debug.apk Forge-Game-Center-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Forge-Game-Center-Android
          path: Forge-Game-Center-Android.apk
